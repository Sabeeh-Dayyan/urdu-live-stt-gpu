name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: stt, POSTGRES_PASSWORD: stt, POSTGRES_DB: stt}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stt -d stt" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    env:
      PYTHONPATH: src:.
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg postgresql-client
      - uses: astral-sh/setup-uv@v6
        with: {version: "0.13.9"}
      - name: Python env (locked)
        run: uv python install 3.11 && uv sync --frozen --no-editable --extra bench --python 3.11
      - name: Test database
        run: PGPASSWORD=stt psql -h localhost -U stt -d stt -c 'CREATE DATABASE stt_test'
      - name: VAD model (2 MB, pinned + verified); Whisper-model tests skip in CI
        run: |
          mkdir -p models
          curl -fsSL -o models/silero_vad.onnx https://github.com/snakers4/silero-vad/raw/v6.2/src/silero_vad/data/silero_vad.onnx
          echo "1a153a22f4509e292a94e67d6f9b85e8deb25b4988682b7e174c65279d8788e3  models/silero_vad.onnx" | sha256sum -c
      - name: Test stream (MPEG-TS built from the committed reference audio)
        run: mkdir -p testbed/media && testbed/make_ts.sh testbed/reference/fleurs_ur.wav testbed/media/fleurs_ur.ts
      - name: Tests
        run: .venv/bin/python -m pytest -q -p no:cacheprovider

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: Build image
        run: docker build -f Dockerfile.cuda -t live-stt:cuda .
      - name: Smoke test
        run: |
          docker run --rm live-stt:cuda show-config -c config/prod-gpu.yaml > /dev/null
          docker run --rm live-stt:cuda download-models -c config/prod-gpu.yaml --check || true
          docker run --rm --entrypoint python live-stt:cuda -c "import live_stt.api.app, live_stt.worker, live_stt.asr.service, faster_whisper, av, onnxruntime; print('imports ok')"
      - name: Compose file is valid
        run: cd deploy && cp .env.example .env && docker compose config -q
