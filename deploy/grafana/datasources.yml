apiVersion: 1
# Server stack (host networking): Prometheus and Postgres are on 127.0.0.1.
# The password is read from the container environment (deploy/.env → POSTGRES_PASSWORD).
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://127.0.0.1:9090
    isDefault: true
  - name: Postgres
    uid: pg-main
    type: grafana-postgresql-datasource
    url: 127.0.0.1:$POSTGRES_PORT
    user: stt
    jsonData: {database: stt, sslmode: disable, postgresVersion: 1600}
    secureJsonData: {password: $POSTGRES_PASSWORD}
