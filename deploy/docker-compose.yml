# Production stack for a Linux server WITH an NVIDIA GPU (driver ≥ 550 + NVIDIA Container Toolkit).
#   cd deploy && cp .env.example .env && $EDITOR .env && docker compose up -d --build
# The app, Prometheus and Grafana use the host network: multicast/unicast UDP feeds arrive at the
# host's interfaces, and every worker exposes its own metrics port. Postgres and Redis listen on
# 127.0.0.1 only. See docs/DEPLOYMENT.md.
name: live-stt-server   # distinct from the dev stack (docker-compose.yml at the repo root)

x-app: &app
  image: live-stt:cuda
  build: {context: .., dockerfile: Dockerfile.cuda}
  network_mode: host
  environment:
    STT_DB__DSN: postgresql://stt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@127.0.0.1:${POSTGRES_PORT:-5432}/stt
    STT_BUS__REDIS_URL: redis://127.0.0.1:${REDIS_PORT:-6379}/0
    STT_API__TOKEN: ${STT_API_TOKEN:?set STT_API_TOKEN in deploy/.env}
    STT_API__PORT: ${STT_API_PORT:-8000}
    STT_API__LINKS__GRAFANA: "{scheme}://{host}:${GRAFANA_PORT:-3000}/d/live-stt"
    STT_RELAY__ARCHIVE_HOURS: ${STT_ARCHIVE_HOURS:-24}
    STT_UPLOADS__MAX_MB: ${STT_UPLOAD_MAX_MB:-4096}
    HF_TOKEN: ${HF_TOKEN:-}
    STT_ASR__DEVICE_INDEX: ${STT_GPU_INDEX:-0}
  volumes:
    - ../models:/app/models
    - ../var:/app/var
    - ../config:/app/config:ro

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: stt
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stt -d stt"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  models:  # one-shot: downloads the pinned models the config needs (first run only), then exits
    <<: *app
    restart: "no"
    command: ["download-models", "-c", "${STT_CONFIG:-config/prod-gpu.yaml}"]

  accuracy:  # one-shot: loads the measured accuracy results (bench/results) for the dashboard
    <<: *app
    restart: "no"
    command: ["record-accuracy", "bench/results", "-c", "${STT_CONFIG:-config/prod-gpu.yaml}"]
    depends_on:
      postgres: {condition: service_healthy}

  stt:
    <<: *app
    restart: unless-stopped
    command: ["supervise", "-c", "${STT_CONFIG:-config/prod-gpu.yaml}"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      models: {condition: service_completed_successfully}
    stop_grace_period: 30s
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('STT_API__PORT', '8000'), timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 120s

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    network_mode: host
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d",
              "--web.listen-address=127.0.0.1:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    network_mode: host
    environment:
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in deploy/.env}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEW:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"   # the dashboard embeds the live player (iframe)
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - ./grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../infra/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, postgres]

volumes:
  pgdata:
  redisdata:
  promdata:
  grafanadata:
