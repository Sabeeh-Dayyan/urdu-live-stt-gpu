<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="1200" height="430" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6f5f1"/><stop offset="1" stop-color="#ecebe5"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0b6e66"/></marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>
      .c{fill:#fff;stroke:#c9d6d2;stroke-width:1.5;filter:url(#sh)}
      .n{font-size:15px;font-weight:700;fill:#fff}
      .t{font-size:15px;font-weight:700;fill:#16191d}
      .s{font-size:12.5px;fill:#334155}
      .m{font-size:12.5px;fill:#0b6e66;font-weight:700}
      .l{stroke:#0b6e66;stroke-width:2.5;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <text x="32" y="44" font-size="22" font-weight="700" fill="#0f172a">From a spoken word to text on screen</text>
  <text x="32" y="68" font-size="14" fill="#475569">CPU profile values. Measured end-to-end delay (speech end → text): median 12.9 s, 95 % 22.5 s (8 s segments, 16 s packing, laptop CPU).</text>

  <g transform="translate(32,100)">
    <rect width="168" height="170" rx="14" class="c"/><circle cx="26" cy="28" r="15" fill="#0b6e66"/><text x="26" y="33" text-anchor="middle" class="n">1</text>
    <text x="50" y="33" class="t">Receive</text>
    <text x="16" y="64" class="s">UDP packets (188 B)</text><text x="16" y="84" class="s">→ decode audio</text><text x="16" y="104" class="s">→ 16 kHz mono</text>
    <text x="16" y="138" class="m">continuous</text>
  </g>
  <path d="M202,185 L226,185" class="l"/>
  <g transform="translate(228,100)">
    <rect width="168" height="170" rx="14" class="c"/><circle cx="26" cy="28" r="15" fill="#0b6e66"/><text x="26" y="33" text-anchor="middle" class="n">2</text>
    <text x="50" y="33" class="t">Time-stamp</text>
    <text x="16" y="64" class="s">broadcast clock (PTS)</text><text x="16" y="84" class="s">→ exact UTC for</text><text x="16" y="104" class="s">every sample</text>
    <text x="16" y="138" class="m">±0.2 s word times</text>
  </g>
  <path d="M398,185 L422,185" class="l"/>
  <g transform="translate(424,100)">
    <rect width="168" height="170" rx="14" class="c"/><circle cx="26" cy="28" r="15" fill="#0b6e66"/><text x="26" y="33" text-anchor="middle" class="n">3</text>
    <text x="50" y="33" class="t">Find speech</text>
    <text x="16" y="64" class="s">Silero VAD, 32 ms</text><text x="16" y="84" class="s">frames; music and</text><text x="16" y="104" class="s">silence skipped</text>
    <text x="16" y="138" class="m">ends after 0.5 s pause</text>
  </g>
  <path d="M594,185 L618,185" class="l"/>
  <g transform="translate(620,100)">
    <rect width="168" height="170" rx="14" class="c"/><circle cx="26" cy="28" r="15" fill="#0b6e66"/><text x="26" y="33" text-anchor="middle" class="n">4</text>
    <text x="50" y="33" class="t">Cut chunks</text>
    <text x="16" y="64" class="s">at pauses, or at the</text><text x="16" y="84" class="s">quietest point when</text><text x="16" y="104" class="s">speech runs on</text>
    <text x="16" y="138" class="m">≤ 8 s per chunk</text>
  </g>
  <path d="M790,185 L814,185" class="l"/>
  <g transform="translate(816,100)">
    <rect width="168" height="170" rx="14" class="c"/><circle cx="26" cy="28" r="15" fill="#0b6e66"/><text x="26" y="33" text-anchor="middle" class="n">5</text>
    <text x="50" y="33" class="t">Transcribe</text>
    <text x="16" y="64" class="s">Whisper large-v3-turbo,</text><text x="16" y="84" class="s">Urdu, word times;</text><text x="16" y="104" class="s">chunks packed ≤ 16 s</text>
    <text x="16" y="138" class="m">guards vs. hallucination</text>
  </g>
  <path d="M986,185 L1010,185" class="l"/>
  <g transform="translate(1012,100)">
    <rect width="156" height="170" rx="14" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5" filter="url(#sh)"/><circle cx="26" cy="28" r="15" fill="#16a34a"/><text x="26" y="33" text-anchor="middle" class="n">6</text>
    <text x="50" y="33" class="t">Show + store</text>
    <text x="16" y="64" class="s">browser: video ⇄ text,</text><text x="16" y="84" class="s">highlight follows video;</text><text x="16" y="104" class="s">PostgreSQL + archive</text>
    <text x="16" y="138" class="m">searchable, exportable</text>
  </g>

  <rect x="32" y="300" width="1136" height="104" rx="14" fill="#fff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="52" y="330" font-size="15" font-weight="700" fill="#0f172a">Then, in the background</text>
  <text x="52" y="356" class="s">• A second, more careful pass (REFINE: beam 5, ±0.5 s context; large-v3 on GPU) re-transcribes each chunk and replaces the live text in place.</text>
  <text x="52" y="378" class="s">• Sentences are rebuilt across chunk cuts (punctuation or a ≥ 1 s pause). Clicking a sentence plays the video from that exact second (HLS PROGRAM-DATE-TIME).</text>
  <text x="52" y="398" class="s">• If the computer falls behind, audio older than 120 s is skipped and logged, so live text never drifts far behind the picture.</text>
</svg>
