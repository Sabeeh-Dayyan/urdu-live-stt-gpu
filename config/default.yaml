# Base configuration. Environment overlays (dev-mac-cpu.yaml, prod-gpu.yaml) override keys here.
# Env vars override everything: STT_<SECTION>__<KEY>=value
environment: default

ingest:
  fifo_size: 1000000          # ffmpeg udp fifo, packets
  buffer_size: 8388608        # socket rcvbuf; on Linux raise net.core.rmem_max to match
  timeout_us: 5000000
  probesize: 500000
  analyzeduration_us: 1000000
  reconnect_min_s: 0.5
  reconnect_max_s: 30
  ring_buffer_s: 120
  sample_rate: 16000

clock:
  discontinuity_s: 1.0
  backward_tolerance_s: 0.05
  warmup_s: 3.0
  drift_threshold_ms: 500     # alert
  drift_correct_ms: 100       # slew sustained offsets above this (timestamp accuracy)
  drift_sustain_s: 10
  drift_target_ms: 50
  drift_slew_ms_per_s: 20
  drift_ema_tau_s: 5

vad:
  model_path: models/silero_vad.onnx
  threshold: 0.5
  min_speech_ms: 250
  min_silence_ms: 500
  speech_pad_ms: 200

streaming:
  mode: segment
  max_segment_s: 8
  cut_search_s: 1.5
  partials_enabled: false
  partial_interval_s: 2.0
  step_s: 1.0
  max_buffer_s: 15

asr:
  device: cpu
  compute_type: int8
  cpu_threads: 8
  num_workers: 1
  download_root: models/whisper
  fast:   {model: large-v3-turbo, beam_size: 1, best_of: 1}
  refine: {model: large-v3, beam_size: 5, best_of: 5}
  refine_enabled: true
  refine_context_s: 0.5
  batched: false
  max_batch: 8
  max_wait_ms: 50
  fast_queue_max: 256
  refine_queue_max: 64
  fast_lag_alert_s: 5
  refine_max_lag_s: 300
  fast_wer_margin: 0.03

guards:
  no_speech_threshold: 0.6
  logprob_threshold: -1.0
  compression_ratio_threshold: 2.4
  max_ngram_repeats: 4
  ngram_n: 3
  blocklist_path: config/hallucination_blocklist.txt

bus:
  redis_url: redis://localhost:6379/0
  maxlen: 100000
  request_maxlen: 5000

db:
  dsn: postgresql://stt:stt@localhost:5432/stt
  flush_ms: 200
  flush_rows: 100

api: {host: 0.0.0.0, port: 8000}
metrics: {enabled: true, base_port: 9100}
logging: {level: INFO, json: true}

channels: []
