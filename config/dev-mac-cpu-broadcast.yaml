# Broadcast test profile: dev-mac-cpu + two live Urdu news channels on UDP 5001/5002
# (local test recordings looped by a separate sender; the footage itself is not part of this repo).
#
# `-c` takes one file, so the dev-mac-cpu settings are repeated here. These two must be identical
# except for `environment`, `bus`, `db`, `channels`:
#   ./stt show-config -c config/dev-mac-cpu-broadcast.yaml
#   ./stt show-config -c config/dev-mac-cpu.yaml,config/dev-mac-cpu-broadcast.yaml
# (Stage 0 check: bench/out/broadcast/stage0/config_equivalence.txt)
environment: dev-mac-cpu-broadcast

asr:
  device: cpu
  compute_type: int8
  cpu_threads: 8
  num_workers: 1
  fast:   {model: large-v3-turbo, beam_size: 1, best_of: 1}
  refine: {model: large-v3-turbo, beam_size: 5, best_of: 5}
  batched: false
  pack_s: 16              # pack queued segments into one encoder pass (measured best on news: see BENCHMARKS)
  refine_max_lag_s: 1800
  fast_max_lag_s: 120      # overloaded host: live text stays ≤ ~2 min behind; skipped audio is logged as a gap

streaming:
  mode: segment
  max_segment_s: 8
  partials_enabled: false

# UDP receive options. ingest/source.py:build_url adds them to every udp:// URL unless the URL
# already sets them (ffmpeg udp protocol options, checked with `ffmpeg -h protocol=udp`, 8.0.1):
#   fifo_size        (188-byte packets)   overrun_nonfatal=1 (always)
#   timeout          (µs, read mode)      buffer_size (SO_RCVBUF bytes)
# macOS kern.ipc.maxsockbuf = 8388608 and SO_RCVBUF=8388608 is accepted on this host
# (bench/out/broadcast/stage0/so_rcvbuf_test.txt). Values = the defaults, stated explicitly.
ingest:
  fifo_size: 1000000
  buffer_size: 8388608
  timeout_us: 5000000

# Isolated from the dev/FLEURS runs:
# * DB: the supervisor overlays YAML channels with the `channels` table (DB wins), and the dev DB
#   already holds ch1 -> udp://127.0.0.1:5101. Using the same DB would silently keep ch1 on 5101.
#   A separate database also keeps broadcast transcripts (local-test-only footage) apart.
# * Redis DB 1: separate request/event streams, so FLEURS backlogs or events never mix in.
#   Redis pub/sub is NOT scoped by DB number, so the live-caption channel needs its own name too
#   (observed 2026-11-21: a dev-profile run's FLEURS captions appeared in this profile's live UI).
bus:
  redis_url: redis://localhost:6379/1
  pubsub_live: transcripts.live.broadcast
db:
  dsn: postgresql://stt:stt@localhost:5432/stt_broadcast

# HLS copy of each channel (video+audio, no re-encode) for the UI player: 15 min live window plus
# a 6 h archive (~1.1 GB per channel-hour at the test feed's ~2.5 Mb/s) for time-range replay.
relay: {enabled: true, dir: var/hls, window_s: 900, segment_s: 2, archive_hours: 6}

logging: {level: INFO, json: false}

channels:
  - id: ch1
    name: News Headlines
    url: "udp://127.0.0.1:5001"
    audio_track: {language: urd}     # verified tag (stage0/check_5001.txt), PID 257
    language: ur
    glossary_path: config/glossary/ur_default.txt
  - id: ch2
    name: Talk Show
    url: "udp://127.0.0.1:5002"
    audio_track: {language: urd}
    language: ur
    glossary_path: config/glossary/ur_default.txt
    enabled: false
