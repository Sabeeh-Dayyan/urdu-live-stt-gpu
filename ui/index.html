<!doctype html>
<html lang="ur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live STT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<script src="/ui/vendor/hls.min.js"></script><!-- hls.js 1.5.20 (vendored) -->
<link rel="stylesheet" href="/ui/common.css">
<script src="/ui/common.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #6b7280; --line: #e3e6eb;
    --accent: #1f6feb; --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --badge: #e7f0ff; --hi: #fff6d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1116; --panel: #161b22; --ink: #e6edf3; --muted: #8b949e; --line: #30363d;
            --accent: #4493f8; --ok: #3fb950; --warn: #d29922; --bad: #f85149; --badge: #1b2a44; --hi: #3a3000; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 8px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0 4px 0 0; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .pill.ok { color: var(--ok); border-color: var(--ok); }
  .pill.bad { color: var(--bad); border-color: var(--bad); }
  header input, select, button { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
                                  background: var(--bg); color: var(--ink); }
  header input { flex: 1 1 180px; min-width: 0; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  a { color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); padding: 6px 16px; }
  main { display: grid; gap: 12px; padding: 12px 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 520px), 1fr)); }
  .ch { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex;
        flex-direction: column; min-width: 0; }
  .ch h2 { font-size: 14px; margin: 0; padding: 10px 12px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .vid { position: relative; background: #000; aspect-ratio: 16 / 9; }
  .vid video { width: 100%; height: 100%; display: block; }
  .vid .msg { position: absolute; inset: auto 0 0 0; padding: 4px 8px; font-size: 12px; color: #fff;
              background: rgba(0,0,0,.6); display: none; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
  .stats div { padding: 6px 10px; border-inline-end: 1px solid var(--line); min-width: 0; }
  .stats div:last-child { border-inline-end: 0; }
  .stats b { display: block; font-size: 16px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 11px; color: var(--muted); }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  .tools .grow { flex: 1; }
  .lines { overflow-y: auto; padding: 4px 12px 8px; height: 46vh; }
  .seg { padding: 4px 0; border-bottom: 1px dashed var(--line); }
  .seg .meta { font-size: 11px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px; font-variant-numeric: tabular-nums; }
  .seg .badge { background: var(--badge); color: var(--accent); border-radius: 4px; padding: 0 5px; }
  .sent { display: grid; grid-template-columns: 76px 1fr 44px; gap: 8px; align-items: baseline; padding: 2px 4px;
          border-radius: 4px; cursor: pointer; }
  .sent:hover { background: var(--bg); }
  .sent.hi { background: var(--hi); }
  .sent .t { font-size: 12px; color: var(--accent); font-variant-numeric: tabular-nums; direction: ltr; display: flex; flex-direction: column; }
  .sent .t small { font-size: 10px; color: var(--muted); }
  .sent .txt { font-family: "Noto Nastaliq Urdu", serif; font-size: 18px; line-height: 2.1; unicode-bidi: plaintext; min-width: 0; }
  .sent .c { font-size: 11px; text-align: end; font-variant-numeric: tabular-nums; }
  .c.hiC { color: var(--ok); } .c.midC { color: var(--warn); } .c.loC { color: var(--bad); }
  .seg.partial .txt { color: var(--muted); }
  .lowp { text-decoration: underline dotted var(--warn); text-underline-offset: 6px; color: var(--warn); }
  .hidden-n { font-size: 11px; color: var(--muted); padding: 4px 0; }
  #results { padding: 0 16px; }
  #results .seg { background: var(--panel); padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; margin-top: 6px; }
  body.embed header, body.embed .note, body.embed nav.top { display: none; }
</style>
</head>
<body>
<header>
  <span id="conn" class="pill">connecting…</span>
  <label>Min confidence
    <select id="minconf" title="Hide sentences below this model confidence (mean word probability)">
      <option value="0">all</option><option value="0.8">≥ 80%</option>
      <option value="0.9" selected>≥ 90%</option><option value="0.95">≥ 95%</option>
    </select>
  </label>
  <input id="q" dir="auto" placeholder="Quick search / تلاش (more in Archive &amp; search)" autocomplete="off">
</header>
<div class="note" id="accnote">Confidence = the model's own word probability, not verified accuracy.</div>
<div id="results"></div>
<main id="grid"></main>
<script>
"use strict";
const MAX_SEGS = 300, STATS_N = 50;
const params = new URLSearchParams(location.search);
if (params.get("embed") === "1") document.body.classList.add("embed");
nav("live");
const grid = document.getElementById("grid");
const minSel = document.getElementById("minconf");
if (params.get("min_conf") != null) minSel.value = params.get("min_conf");
const panels = new Map();   // channel_id -> panel
const minConf = () => parseFloat(minSel.value) || 0;

// ---- per-channel panel
function panel(cid, name) {
  if (panels.has(cid)) return panels.get(cid);
  const el = document.createElement("section");
  el.className = "ch";
  el.innerHTML = `
    <h2><span class="nm"></span><span><button class="live" title="Jump to live video">● LIVE</button></span></h2>
    <div class="vid"><video muted playsinline controls></video><div class="msg"></div></div>
    <div class="stats">
      <div><b class="sLat">–</b><span>speech end → text (p50)</span></div>
      <div><b class="sConf">–</b><span>avg confidence (last ${STATS_N})</span></div>
      <div><b class="sHi">–</b><span>sentences ≥ 90% conf</span></div>
      <div><b class="sSeg">0</b><span>segments · refined</span></div>
    </div>
    <div class="tools">
      <span class="grow"></span>
      <select class="range" title="Export range">
        <option value="900">last 15 min</option><option value="3600" selected>last 1 h</option>
        <option value="21600">last 6 h</option><option value="86400">last 24 h</option>
      </select>
      <button data-f="srt">SRT</button><button data-f="vtt">VTT</button>
      <button data-f="csv">CSV</button><button data-f="txt">TXT</button><button data-f="json">JSON</button>
    </div>
    <div class="lines"></div><div class="hidden-n"></div>`;
  el.querySelector(".nm").textContent = name ? `${name} (${cid})` : cid;
  grid.appendChild(el);
  const p = { cid, el, lines: el.querySelector(".lines"), video: el.querySelector("video"),
              msg: el.querySelector(".msg"), hiddenEl: el.querySelector(".hidden-n"),
              segs: new Map(), stats: [], nSeg: 0, nRef: 0, hls: null };
  for (const b of el.querySelectorAll("button[data-f]")) b.onclick = () => exportFile(p, b.dataset.f);
  el.querySelector(".live").onclick = () => goLive(p);
  initVideo(p);
  panels.set(cid, p);
  return p;
}

function exportFile(p, fmt) {
  const secs = parseInt(p.el.querySelector(".range").value, 10);
  const q = new URLSearchParams({ format: fmt, from: String(Date.now() / 1000 - secs),
    min_conf: String(minConf()), tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC" });
  location.href = `/channels/${encodeURIComponent(p.cid)}/export?${q}`;
}

// ---- video (HLS written by the channel worker; EXT-X-PROGRAM-DATE-TIME = wall clock)
function showMsg(p, text) { p.msg.textContent = text; p.msg.style.display = text ? "block" : "none"; }
function initVideo(p) {
  const src = `/hls/${encodeURIComponent(p.cid)}/index.m3u8`;
  if (window.Hls && Hls.isSupported()) {
    const h = new Hls({ liveSyncDurationCount: 3, maxBufferLength: 30, backBufferLength: 120 });
    h.on(Hls.Events.ERROR, (_, d) => {
      if (d.fatal) {
        showMsg(p, "video unavailable (relay off or stream down) — retrying");
        setTimeout(() => { h.destroy(); p.hls = null; initVideo(p); }, 10000);
      }
    });
    h.on(Hls.Events.MANIFEST_PARSED, () => { showMsg(p, ""); p.video.play().catch(() => {}); });
    h.loadSource(src); h.attachMedia(p.video); p.hls = h;
  } else if (p.video.canPlayType("application/vnd.apple.mpegurl")) {  // Safari: native HLS
    p.video.src = src; p.video.play().catch(() => {});
  } else {
    showMsg(p, "this browser cannot play HLS");
  }
}
function goLive(p) {
  showMsg(p, ""); p.holdScroll = false; p.lines.scrollTop = p.lines.scrollHeight;
  if (p.hls && p.hls.liveSyncPosition != null) p.video.currentTime = p.hls.liveSyncPosition;
  else if (p.video.seekable.length) p.video.currentTime = p.video.seekable.end(p.video.seekable.length - 1) - 6;
  p.video.play().catch(() => {});
}
function seekTo(p, t) {   // t = epoch seconds (UTC)
  const ms = t * 1000;
  let pos = null, first = null, last = null;
  if (p.hls && p.hls.levels && p.hls.levels.length) {
    const lv = p.hls.levels[Math.max(p.hls.currentLevel, 0)];
    const frags = (lv && lv.details && lv.details.fragments) || [];
    for (const f of frags) {
      if (f.programDateTime == null) continue;
      first = first ?? f.programDateTime; last = f.programDateTime + f.duration * 1000;
      if (ms >= f.programDateTime && ms < f.programDateTime + f.duration * 1000) {
        pos = f.start + (ms - f.programDateTime) / 1000; break;
      }
    }
  } else if (p.video.getStartDate && !isNaN(p.video.getStartDate().getTime())) {
    pos = (ms - p.video.getStartDate().getTime()) / 1000;
  }
  if (pos == null || pos < 0) {
    const win = first ? ` (video buffered ${fmtLocal(first / 1000)}–${fmtLocal(last / 1000)})` : "";
    showMsg(p, `no video for ${fmtLocal(t)}${win}`);
    return false;
  }
  showMsg(p, `playing from ${fmtLocal(t)} — press LIVE to return`);
  p.video.currentTime = pos; p.video.muted = false; p.video.play().catch(() => {});
  return true;
}

// ---- transcript rendering: keep segments per channel, re-assemble sentences on every change
function highlight(p, row) {
  for (const r of p.lines.querySelectorAll(".sent.hi")) r.classList.remove("hi");
  row.classList.add("hi");
  p.hiT = parseFloat(row.dataset.t);
}
function sentRow(p, s) {
  const row = document.createElement("div");
  row.className = "sent";
  row.dataset.t = s.s;
  row.title = `${fmtUtc(s.s)} → ${fmtUtc(s.e)} · ${s.pass}` + (s.lat != null ? ` · latency ${s.lat.toFixed(1)} s` : "") +
              ` · ${s.segs.length} segment(s) — click to play video from here`;
  row.innerHTML = `<span class="t"><span class="tt"></span><small class="pm"></small></span><span class="txt" dir="auto"></span><span class="c"></span>`;
  row.querySelector(".tt").textContent = fmtLocal(s.s);
  row.querySelector(".pm").textContent = s.pass + (s.lat != null ? ` · ${Math.round(s.lat)} s` : "");
  const txt = row.querySelector(".txt");
  s.ws.forEach((w, i) => {   // per-word spans; low-confidence words are underlined
    const t = wordOf(w)[0];
    if (i) txt.appendChild(document.createTextNode(" "));
    const sp = document.createElement("span");
    sp.textContent = t;
    if (typeof w.p === "number" && w.p < LOW_WORD) { sp.className = "lowp"; sp.title = `word confidence ${Math.round(w.p * 100)}%`; }
    txt.appendChild(sp);
  });
  const c = row.querySelector(".c");
  c.textContent = s.c == null ? "" : `${Math.round(s.c * 100)}%`;
  c.className = "c " + confClass(s.c);
  if (p.hiT != null && Math.abs(p.hiT - s.s) < 0.01) row.classList.add("hi");
  row.onclick = () => { highlight(p, row); seekTo(p, s.s); };
  return row;
}
function render(p) {
  p.pending = false;
  const atBottom = p.lines.scrollHeight - p.lines.scrollTop - p.lines.clientHeight < 60;
  const rows = [...p.segs.values()].sort((a, b) => a.start_utc - b.start_utc).slice(-MAX_SEGS);
  const sents = assemble(rows);
  const frag = document.createDocumentFragment();
  let hidden = 0;
  for (const s of sents) {
    if (minConf() > 0 && !(s.c != null && s.c >= minConf())) { hidden++; continue; }
    frag.appendChild(sentRow(p, s));
  }
  const top = p.lines.scrollTop;
  p.lines.replaceChildren(frag);
  p.hiddenEl.textContent = hidden ? `${hidden} sentence(s) below ${Math.round(minConf() * 100)}% confidence hidden` : "";
  const sc = sents.slice(-STATS_N).map(s => s.c);
  p.el.querySelector(".sHi").textContent = sc.length ? `${Math.round(100 * sc.filter(c => c != null && c >= 0.9).length / sc.length)}%` : "–";
  if (atBottom && !p.holdScroll) p.lines.scrollTop = p.lines.scrollHeight; else p.lines.scrollTop = top;
}
function schedule(p) { if (!p.pending) { p.pending = true; requestAnimationFrame(() => render(p)); } }
function updateStats(p) {
  const st = p.stats.slice(-STATS_N);
  const lats = st.map(x => x.lat).filter(x => x != null).sort((a, b) => a - b);
  const confs = st.map(x => x.c).filter(x => x != null);
  p.el.querySelector(".sLat").textContent = lats.length ? `${lats[Math.floor(lats.length / 2)].toFixed(1)} s` : "–";
  p.el.querySelector(".sConf").textContent = confs.length ? `${Math.round(100 * confs.reduce((a, b) => a + b, 0) / confs.length)}%` : "–";
  p.el.querySelector(".sSeg").textContent = `${p.nSeg} · ${p.nRef}`;
}
function segConf(ev) {
  const ps = (ev.words || []).map(w => w && w.p).filter(x => typeof x === "number");
  return ev.confidence ?? (ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null);
}
function onEvent(ev) {
  if (!ev || !ev.channel_id) return;
  const p = panel(ev.channel_id);
  if (ev.type === "refine_skipped" || ev.type === "error") return;
  if (ev.type === "partial") { if (ev.segment_key) p.segs.set("k:" + ev.segment_key, ev); schedule(p); return; }
  if (ev.segment_key) p.segs.delete("k:" + ev.segment_key);
  const had = p.segs.has(ev.segment_id);
  if (ev.type === "final" && !ev.text_raw) { p.segs.delete(ev.segment_id); schedule(p); return; }
  if (ev.type === "final" && had && p.segs.get(ev.segment_id).type === "refined") return;  // late duplicate
  p.segs.set(ev.segment_id, ev);
  if (p.segs.size > 2 * MAX_SEGS) {   // drop the oldest segments
    const old = [...p.segs.entries()].sort((a, b) => a[1].start_utc - b[1].start_utc).slice(0, p.segs.size - MAX_SEGS);
    for (const [k] of old) p.segs.delete(k);
  }
  if (ev.type === "refined") p.nRef++; else if (!had) p.nSeg++;
  const lat = (ev.timings || {}).latency_s ?? ev.latency_s;
  p.stats.push({ lat: ev.type === "refined" ? null : lat, c: segConf(ev) });
  if (p.stats.length > 4 * STATS_N) p.stats.splice(0, p.stats.length - 2 * STATS_N);
  updateStats(p);
  schedule(p);
}
function rerenderAll() { for (const p of panels.values()) render(p); }
minSel.addEventListener("change", rerenderAll);

// ---- data loading
async function loadHistory(p, around) {
  const q = new URLSearchParams({ limit: "200" });
  if (around) { q.set("from", String(around - 300)); q.set("to", String(around + 300)); }
  try {
    const r = await fetch(`/channels/${encodeURIComponent(p.cid)}/transcripts?${q}`);
    if (!r.ok) return;
    for (const row of await r.json()) onEvent(Object.assign({}, row, { type: row.pass === "refined" ? "refined" : "final" }));
    render(p);
    p.lines.scrollTop = p.lines.scrollHeight;
  } catch (e) { /* API may be starting */ }
}
async function loadChannels() {
  const only = params.get("ch");
  try {
    const r = await fetch("/channels");
    if (!r.ok) return;
    for (const c of await r.json()) {
      if (!c.enabled || (only && c.id !== only)) continue;
      const p = panel(c.id, c.name);
      const t = parseFloat(params.get("t"));
      await loadHistory(p, only === c.id && !isNaN(t) ? t : null);
      if (only === c.id && !isNaN(t)) jumpTo(p, t);
    }
  } catch (e) { /* retry on next reload */ }
}
function jumpTo(p, t) {   // deep link from Grafana: highlight the sentence and play video from it
  let best = null;
  for (const row of p.lines.querySelectorAll(".sent")) {
    if (parseFloat(row.dataset.t) <= t + 0.5) best = row;
  }
  if (best) { highlight(p, best); best.scrollIntoView({ block: "center" }); p.holdScroll = true; }
  const tryseek = (n) => { if (!seekTo(p, t) && n > 0) setTimeout(() => tryseek(n - 1), 1500); };
  tryseek(6);   // wait for the playlist to load
}
async function loadAccuracyNote() {
  try {
    const r = await fetch("/accuracy");
    if (!r.ok) return;
    const rows = await r.json();
    const f = (m, t) => rows.find(x => x.kind === "calibration_word" && x.metric === m && Math.abs(x.threshold - t) < 1e-6);
    const w90 = f("precision", 0.9), b90 = f("precision_below", 0.9), k90 = f("kept_share", 0.9);
    const all = f("precision", 0);
    if (w90 && b90 && k90 && all) document.getElementById("accnote").textContent =
      `Confidence is the model's own word probability, not verified accuracy. Measured on ${w90.dataset} (read speech): ` +
      `${Math.round(all.value * 100)}% of all words correct; words ≥ 90% confidence ${Math.round(w90.value * 100)}% correct ` +
      `(${Math.round(k90.value * 100)}% of words); underlined words (< 90%) only ${Math.round(b90.value * 100)}% correct.`;
  } catch (e) { /* optional */ }
}

let delay = 500;
function connect() {
  const chans = params.get("ch") || params.get("channels") || "";
  const proto = location.protocol === "https:" ? "wss" : "ws";
  const ws = new WebSocket(`${proto}://${location.host}/ws/live${chans ? "?channels=" + encodeURIComponent(chans) : ""}`);
  const conn = document.getElementById("conn");
  ws.onopen = () => { conn.textContent = "live"; conn.className = "pill ok"; delay = 500; };
  ws.onmessage = (m) => { try { onEvent(JSON.parse(m.data)); } catch (e) { console.warn(e); } };
  ws.onclose = () => {
    conn.textContent = "reconnecting…"; conn.className = "pill bad";
    setTimeout(connect, delay); delay = Math.min(delay * 2, 10000);
  };
}
let st = null;
document.getElementById("q").addEventListener("input", (e) => {
  clearTimeout(st);
  st = setTimeout(async () => {
    const q = e.target.value.trim();
    const box = document.getElementById("results");
    box.replaceChildren();
    if (!q) return;
    try {
      const r = await fetch("/search?q=" + encodeURIComponent(q));
      const j = await r.json();
      for (const row of j.results || []) {
        const n = document.createElement("div");
        n.className = "seg";
        const sent = document.createElement("div");
        sent.className = "sent";
        sent.innerHTML = `<span class="t"></span><span class="txt" dir="auto"></span><span class="c"></span>`;
        sent.querySelector(".t").textContent = fmtLocal(row.start_utc);
        sent.querySelector(".txt").textContent = row.text_raw;
        sent.querySelector(".c").textContent = row.channel_id;
        sent.title = "open this moment with video and transcript (Archive)";
        sent.onclick = () => { location.href = `/ui/archive?ch=${encodeURIComponent(row.channel_id)}&t=${row.start_utc}`; };
        n.appendChild(sent);
        box.appendChild(n);
      }
    } catch (err) { console.warn(err); }
  }, 300);
});

loadChannels().then(connect);
loadAccuracyNote();
</script>
</body>
</html>
