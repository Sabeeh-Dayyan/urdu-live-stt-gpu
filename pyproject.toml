[project]
name = "live-stt"
version = "0.1.0"
description = "Real-time speech-to-text for live MPEG-TS/UDP television feeds (Urdu-first)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Versions verified 2026-11-20 against PyPI. Constraint: must ship wheels for
# cp311 macOS x86_64 (dev: Intel i9 Mac) AND Linux x86_64 (prod). Exact pins after resolution.
dependencies = [
    # Ingest. 18.1.0 = newest PyAV with cp311 wheels (19.x requires Python >=3.12).
    "av==18.1.0",
    "numpy==2.4.6",                 # 2.5 requires Python >=3.12
    # VAD. 1.23.2 is the last onnxruntime release with macOS x86_64 wheels.
    "onnxruntime==1.23.2",
    # ASR (optional at import time; workers do not load it).
    "faster-whisper==1.2.1",
    # Bus / storage
    "redis==8.1.0",
    "asyncpg==0.32.0",
    # API
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "websockets==17.4",          # uvicorn's WebSocket protocol implementation
    # Observability / config / CLI
    "prometheus-client==0.26.0",
    "structlog==26.1.0",
    "pydantic-settings==2.16.3",
    "pyyaml==6.0.3",
    "typer==0.29.2",
    # IANA time zones for exports (?tz=Asia/Karachi); slim/CUDA base images ship no tz database.
    "tzdata==2026.6",
]

[project.optional-dependencies]
bench = ["jiwer==4.0.0"]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0", "hypothesis==6.170.17", "httpx==0.28.1", "pytest-timeout==2.4.0"]

[project.scripts]
stt = "live_stt.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/live_stt"]

[tool.uv]
# Never build heavy native packages from source on either platform.
no-build-package = ["av", "numpy", "onnxruntime", "ctranslate2", "tokenizers", "asyncpg"]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 180
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src", "."]
